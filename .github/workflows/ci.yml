name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.6", "2.7", "3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Load the library with declared dependencies
        run: bundle exec ruby -Ilib -e 'require "utcp"; require "ruby-utcp"'
      - name: Unit and regression tests
        run: bundle exec rake test
      - name: Build the gem
        run: gem build ruby-utcp.gemspec

  coverage-and-transports:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Line and branch coverage
        run: bundle exec rake coverage
      - name: Local transport integration tests
        run: bundle exec make standard-demo
