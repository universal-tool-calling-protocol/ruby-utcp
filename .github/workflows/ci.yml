name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UTCP_SOAK_DURATION: ${{ github.event_name == 'workflow_dispatch' && '300' || '60' }}
  UTCP_SOAK_WARMUP: ${{ github.event_name == 'workflow_dispatch' && '30' || '10' }}
  UTCP_SOAK_INTERVAL: "10"

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.6", "2.7", "3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Load the library with declared dependencies
        run: bundle exec ruby -Ilib -e 'require "utcp"; require "ruby-utcp"'
      - name: Unit and regression tests
        run: bundle exec rake test
      - name: Build the gem
        run: gem build ruby-utcp.gemspec

  coverage-and-transports:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Line and branch coverage
        run: bundle exec rake coverage
      - name: Local transport integration tests
        run: bundle exec make standard-demo

  transport-soak:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: HTTP stream and resource soak
        run: bundle exec rake 'soak[http]'
      - name: Preserve HTTP memory and workload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-soak
          path: tmp/soak/http.json

  native-transports:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      UTCP_NATIVE_TESTS: "1"
      BUNDLE_PATH: vendor/native
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev pkg-config
          bundle install
      - name: Fetch libdatachannel 0.24.5
        uses: actions/checkout@v6
        with:
          repository: paullouisageneau/libdatachannel
          ref: 443f6934d9007eb7076ab7825ba330f355fcbead
          submodules: recursive
          path: .native/libdatachannel
          persist-credentials: false
      - name: Build the WebRTC backend
        run: |
          webrtc_dir="$(bundle show webrtc-ruby)"
          mkdir -p "$webrtc_dir/vendor"
          ln -s "$GITHUB_WORKSPACE/.native/libdatachannel" "$webrtc_dir/vendor/libdatachannel"
          cmake -S "$webrtc_dir/vendor/libdatachannel" -B "$webrtc_dir/vendor/libdatachannel/build" \
            -DCMAKE_BUILD_TYPE=Release -DUSE_GNUTLS=OFF -DUSE_NICE=OFF \
            -DNO_WEBSOCKET=ON -DNO_EXAMPLES=ON -DNO_TESTS=ON
          cmake --build "$webrtc_dir/vendor/libdatachannel/build" --parallel 2
          cmake -S "$webrtc_dir/ext/webrtc_ruby" -B "$webrtc_dir/ext/webrtc_ruby/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$webrtc_dir/ext/webrtc_ruby/build" --parallel 2
          echo "LD_LIBRARY_PATH=$webrtc_dir/vendor/libdatachannel/build:$webrtc_dir/ext/webrtc_ruby/build" >> "$GITHUB_ENV"
      - name: Real gRPC and WebRTC integration tests
        env:
          TESTOPTS: --verbose
        run: bundle exec rake native
      - name: Native WebRTC lifecycle and memory soak
        run: bundle exec rake 'soak[webrtc]'
      - name: Preserve WebRTC memory and workload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-soak
          path: tmp/soak/webrtc.json
